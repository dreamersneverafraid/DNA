<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Tally Board by DNA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: one 720px column. Brand bar, then one view at a time: home, sport pick, setup, live scoreboard. */
:root{
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#E8ECEF; --surface:#F5F7F8; --fg:#13202B; --muted:#586874; --line:#C6D0D7;
  --a:#1F5FBF; --on-a:#FFFFFF;
  --b:#C8460F; --on-b:#FFFFFF;
  --out:#B3261E; --on-out:#FFFFFF;
  --board:#0E1923; --lit:#F3F6F8; --board-muted:#8FA1AF;
  --a-lit:#78AEFF; --b-lit:#FF9A70;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1218; --surface:#131D26; --fg:#E7EDF1; --muted:#8DA0AE; --line:#243340;
    --a:#5C9CFF; --on-a:#06101C; --b:#FF8C5A; --on-b:#1A0A02;
    --out:#FF6F66; --on-out:#1A0605; --board:#05090D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1218; --surface:#131D26; --fg:#E7EDF1; --muted:#8DA0AE; --line:#243340;
  --a:#5C9CFF; --on-a:#06101C; --b:#FF8C5A; --on-b:#1A0A02;
  --out:#FF6F66; --on-out:#1A0605; --board:#05090D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:400 16px/1.45 var(--body);
  padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{margin:0;font:800 clamp(24px,6vw,30px)/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
p{margin:0}
.lbl{margin:0 0 6px;font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:14px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:4px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;padding:0;border:0;background:none;color:var(--fg);cursor:pointer;text-align:left}
.brand:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.wm{font:800 clamp(30px,8vw,40px)/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.by{font:600 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tag{font:600 13px var(--body);letter-spacing:.03em;color:var(--muted)}
button.tag{padding:0;border:0;background:none;text-align:left;cursor:pointer}
button.tag:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.brandcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.me{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 5px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font:600 14px var(--body);cursor:pointer;max-width:100%}
.me.guest{padding:0 16px}
.me:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.avatar{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--a);color:var(--on-a);font:700 16px var(--display)}
.avatar.big{width:84px;height:84px;font-size:36px}
.herorow{display:flex;align-items:center;gap:14px;min-width:0}
.herorow>div{min-width:0}
.accs{display:flex;flex-direction:column;gap:8px}
.acc{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px 6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:600 16px var(--body);text-align:left;cursor:pointer;min-width:0}
.acc:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.won{flex:none;font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats>div{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.stats b{font:800 32px/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who h2{overflow-wrap:anywhere}
.pill{flex:none;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill.live{background:var(--out);color:var(--on-out);border-color:transparent}
.pill.registration{color:var(--fg);border-color:var(--fg)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;white-space:nowrap}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left;white-space:normal;min-width:84px;width:100%}
.tbl th:first-child,.tbl td:first-child{padding-left:10px}
.tbl th:last-child,.tbl td:last-child{padding-right:10px}
.tbl th{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tbl tr+tr td{border-top:1px solid var(--line)}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rowline:first-of-type{border-top:0}
div.name{padding:4px 2px;overflow-wrap:anywhere}
.err{color:var(--out);font-weight:600;font-size:14px}
.prow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.filebtn{display:inline-flex;align-items:center;padding:0 16px;cursor:pointer}
.sr:focus-visible+.filebtn{outline:3px solid var(--fg);outline-offset:2px}

.btn{min-height:56px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:var(--surface);color:var(--fg);font:700 24px var(--display);letter-spacing:.03em;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.a{background:var(--a);color:var(--on-a)}
.btn.b{background:var(--b);color:var(--on-b)}
.btn.out{background:var(--out);color:var(--on-out);font-size:22px}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.ghost{background:var(--surface);border-color:var(--line);font:600 15px var(--body);min-height:44px;letter-spacing:0}
.btn.ghost.big{font:700 21px var(--display);min-height:56px;letter-spacing:.03em}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.bar .btn{flex:1 1 auto}

/* home and pick */
.hero{display:flex;flex-direction:column;gap:6px;padding:20px 16px;border-radius:14px;background:var(--board);color:var(--lit)}
.hero h2{font-size:clamp(30px,8vw,44px)}
.hero p{color:var(--board-muted);font-size:15px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;min-height:128px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);text-align:left;font:inherit;cursor:pointer}
.choice:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.choice h3{margin:0;font:800 26px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.choice p{color:var(--muted);font-size:14px}
.choice.primary{background:var(--a);color:var(--on-a);border-color:transparent}
.choice.primary p{color:inherit;opacity:.85}
.choice:disabled{opacity:.6;cursor:not-allowed}
.soon{margin-top:auto;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.resume b{font-family:var(--display);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.resume .btn{min-height:44px;font-size:18px;padding:0 18px}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumb .btn{min-height:40px;padding:0 14px}

/* setup */
.panel{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;min-width:0}
.inp,textarea.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
textarea.inp{min-height:132px;resize:vertical;line-height:1.4}
.inp:focus-visible{outline:3px solid var(--fg);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:600 15px var(--body);cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
select{min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
select:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.opts .field{flex:1 1 140px}

/* scoreboard */
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--board);color:var(--lit);border-radius:14px;padding:16px 12px}
.side{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.side[data-t="a"]{--tc:var(--a-lit)}
.side[data-t="b"]{--tc:var(--b-lit)}
.name{width:100%;min-width:0;padding:4px 2px;background:transparent;border:0;border-bottom:2px solid var(--tc);border-radius:0;color:var(--lit);font:700 clamp(15px,4.4vw,20px) var(--display);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.name:focus-visible{outline:2px solid var(--lit);outline-offset:2px}
.score{padding-top:10px;font:800 clamp(40px,12vw,88px)/1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sub{min-height:1.4em;font-size:13px;color:var(--board-muted)}
.roster{min-height:1.2em;max-width:100%;font-size:13px;color:var(--lit);overflow-wrap:anywhere}
.mid{min-width:56px;padding-top:14px;display:flex;flex-direction:column;align-items:center}
.meta{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--board-muted);text-align:center}
.status{grid-column:1/-1;margin-top:6px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--lit) 18%,transparent);text-align:center;font-weight:500;min-height:2.2em}

.controls{display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.thead{display:flex;align-items:center;min-width:0;font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.thead[data-t="a"]{--tc:var(--a)}
.thead[data-t="b"]{--tc:var(--b)}
.thead span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead::before{content:"";flex:none;width:10px;height:10px;margin-right:8px;background:var(--tc)}
.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g1{grid-template-columns:minmax(0,1fr)}
.runs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.extras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.extras .out{grid-column:1/-1}
.batters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:stretch}
.bt{display:flex;flex-direction:column;gap:2px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.bt.on{border-color:var(--fg)}
.bt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bt b{font:700 18px var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.picker{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--fg);border-radius:12px;background:var(--surface)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

.over{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.over .lbl{margin:0 4px 0 0}
.chip{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 6px;border:1px solid var(--line);border-radius:18px;font:600 15px var(--body);font-variant-numeric:tabular-nums;background:var(--surface)}
.chip.w{background:var(--out);color:var(--on-out);border-color:transparent}
.chip.ex{border-style:dashed}
.chip.f{border-color:var(--fg);font-weight:700}
.empty{color:var(--muted);font-size:14px}
.games{display:flex;flex-wrap:wrap;gap:8px}
.gchip{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;font-variant-numeric:tabular-nums}
.scorers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;font-size:14px}
.scorers div{min-width:0;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0}
.log li{padding:8px 0;border-top:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.log li:first-child{border-top:0}

@media (max-width:420px){.choices{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.pph{display:grid;place-items:center;width:min(340px,82vw);aspect-ratio:1;border-radius:16px;object-fit:cover;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:800 64px var(--display)}
.pph.ph{background:var(--a);color:var(--on-a);border-color:transparent}
.slide{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.slide .tagc{display:inline-block;padding:2px 10px;border:1px solid var(--line);border-radius:999px;font:600 13px var(--body);color:var(--muted)}
details.panel>summary{cursor:pointer;min-height:24px}
.vb{display:inline-block;flex:none;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--a);color:var(--on-a);font:600 11px/1.6 var(--body);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.coin{display:grid;place-items:center;width:96px;height:96px;margin:4px auto;border-radius:50%;background:linear-gradient(145deg,#E9C46A,#B8860B);color:#3A2A00;font:800 40px var(--display);box-shadow:inset 0 0 0 6px rgba(255,255,255,.35)}
.coin.spin{animation:coinflip 1s cubic-bezier(.2,.7,.3,1)}
@keyframes coinflip{from{transform:rotateY(0)}to{transform:rotateY(1800deg)}}
@media (prefers-reduced-motion:reduce){.coin.spin{animation:none}}
/* Intro: Made with DNA Studios, then Created by EZ, which glitches into Vaasu Agarwal */
#intro{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#0B141C;color:#F3F6F8;cursor:pointer;transition:opacity .5s ease;overflow:hidden}
#intro.out{opacity:0;pointer-events:none}
#intro::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.in-stage{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 16px;max-width:100vw}
.in-small{font:600 13px var(--body);letter-spacing:.32em;text-transform:uppercase;color:#8FA1AF}
.in-big{position:relative;display:inline-block;font:800 clamp(38px,11vw,104px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.in-big.long{font-size:clamp(28px,9vw,96px)}
.in-bar{width:0;height:3px;background:linear-gradient(90deg,#78AEFF,#FF9A70);border-radius:2px}
#intro.go .in-bar{animation:inBar 1s .45s cubic-bezier(.2,.7,.2,1) forwards}
.in-tag{font:600 13px var(--body);letter-spacing:.06em;color:#8FA1AF;opacity:0}
#intro.go .in-tag{animation:inFade .6s 1s forwards}
#intro .s1{opacity:0}
#intro.go .s1{animation:inUp .8s cubic-bezier(.2,.7,.2,1) both}
.s2{opacity:0;visibility:hidden}
#intro.p2 .s1{animation:inOut .35s ease-in forwards}
#intro.p2 .s2{opacity:1;visibility:visible;transition:opacity .35s .15s}
.in-skip{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:600 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:#5E7080}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;opacity:0;pointer-events:none}
.glitching{animation:gJit .14s steps(2) infinite}
.glitching::before{opacity:.95;color:#FF2E63;animation:gA .22s steps(2) infinite}
.glitching::after{opacity:.95;color:#08F7FE;animation:gB .26s steps(2) infinite}
.settle{animation:gSettle .6s ease-out}
@keyframes inUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes inFade{to{opacity:1}}
@keyframes inOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.96);visibility:hidden}}
@keyframes inBar{to{width:min(260px,60vw)}}
@keyframes gJit{0%{transform:translate(0,0) skewX(0)}25%{transform:translate(-3px,1px) skewX(-6deg)}50%{transform:translate(3px,-1px) skewX(4deg)}75%{transform:translate(-1px,2px) skewX(0)}100%{transform:translate(2px,0) skewX(-3deg)}}
@keyframes gA{0%{clip-path:inset(8% 0 62% 0);transform:translate(-7px,-2px)}33%{clip-path:inset(48% 0 24% 0);transform:translate(6px,1px)}66%{clip-path:inset(72% 0 6% 0);transform:translate(-4px,2px)}100%{clip-path:inset(22% 0 50% 0);transform:translate(5px,-1px)}}
@keyframes gB{0%{clip-path:inset(60% 0 12% 0);transform:translate(6px,1px)}33%{clip-path:inset(14% 0 66% 0);transform:translate(-6px,-2px)}66%{clip-path:inset(38% 0 40% 0);transform:translate(4px,2px)}100%{clip-path:inset(80% 0 4% 0);transform:translate(-5px,1px)}}
@keyframes gSettle{0%{text-shadow:-4px 0 #FF2E63,4px 0 #08F7FE;filter:brightness(1.6)}100%{text-shadow:none;filter:none}}
@media (prefers-reduced-motion:reduce){#intro.go .s1,#intro.go .in-bar,#intro.go .in-tag{animation:none;opacity:1}#intro.p2 .s1{animation:none;opacity:0;visibility:hidden}.in-bar{width:min(260px,60vw)}.glitching,.glitching::before,.glitching::after,.settle{animation:none}.glitching::before,.glitching::after{opacity:0}}
.rmx{min-width:44px;padding:0 12px;font-size:18px}
/* auction slideshow (presentation mode) */
#pres{position:fixed;inset:0;z-index:950;display:flex;flex-direction:column;background:#0B141C;color:#F3F6F8;overflow:hidden}
#pres .pr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#8FA1AF}
#pres .pr-top b{color:#F3F6F8;font:800 18px var(--display);letter-spacing:.06em}

<script>
(function(){
  var HTML='<div class="in-stage s1"><span class="in-small">Made with</span><span class="in-big">DNA Studios</span><span class="in-bar"></span><span class="in-tag">#dreamersneverafraid</span></div>'+
    '<div class="in-stage s2"><span class="in-small">Created by</span><span class="in-big glitch" id="inName" data-text="EZ">EZ</span></div>'+
    '<span class="in-skip">Tap to skip</span>';
  function play(){
    if(document.getElementById('intro'))return;
    var el=document.createElement('div');
    el.id='intro';el.setAttribute('aria-hidden','true');el.innerHTML=HTML;
    document.body.appendChild(el);
    var n=el.querySelector('#inName'),timers=[],gone=false,started=false;
    function at(ms,f){timers.push(setTimeout(f,ms))}
    function done(){
      if(gone)return;gone=true;
      timers.forEach(clearTimeout);
      document.removeEventListener('keydown',key);
      el.classList.add('out');
      setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},520);
    }
    function key(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' ')done()}
    el.addEventListener('click',done);
    document.addEventListener('keydown',key);
    function start(){
      if(started||gone)return;started=true;
      el.classList.add('go');
      at(2100,function(){el.classList.add('p2')});
      at(3100,function(){n.classList.add('glitching')});
      at(3550,function(){n.textContent='Vaasu Agarwal';n.setAttribute('data-text','Vaasu Agarwal');n.classList.add('long')});
      at(4150,function(){n.classList.remove('glitching');n.classList.add('settle')});
      at(6000,done);
    }
    /* start only once the page is really on screen, so it is not used up while loading out of sight */
    function whenSeen(){
      if(document.visibilityState==='hidden')return;
      requestAnimationFrame(function(){requestAnimationFrame(start)});
    }
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){
        for(var i=0;i<es.length;i++)if(es[i].isIntersecting){io.disconnect();whenSeen();return}
      });
      io.observe(el);
    }else whenSeen();
    document.addEventListener('visibilitychange',function v(){if(document.visibilityState==='visible'){document.removeEventListener('visibilitychange',v);whenSeen()}});
  }
  window.__tallyIntro=play;
  if(!window.__noIntro)play();
})();
</script>

<script>
(function(){
  var STORE='tally-board-v2';
  var KEY={basketball:'bb',football:'fb',cricket:'ck',badminton:'bm'};
  var INFO={
    basketball:{t:'Basketball',d:'Quarters with 1, 2 and 3 point scoring'},
    football:{t:'Football',d:'Halves, with the player who scored each goal'},
    cricket:{t:'Cricket',d:'Named players, strike change, double or negative runs'},
    badminton:{t:'Badminton',d:'Singles or doubles, first to 21'}
  };
  var PB=['Q1','Q2','Q3','Q4','OT'];
  var PF=['1st half','2nd half','Extra time','Penalties'];

  function inn(){return{runs:0,wk:0,balls:0,ex:0,t:[],over:false,bat:{},str:0,non:1,next:2,bowl:-1,bw:{}}}
  function cfg0(){
    return{
      ck:{overs:20,n:11,mode:'standard',neg:0,negov:0,dbl:2,pen:5,pl:{a:[],b:[]}},
      fb:{pl:{a:[],b:[]}},
      bm:{fmt:'singles',pl:{a:[],b:[]}}
    };
  }
  function newMatch(k){
    if(k==='bb')return{a:0,b:0,p:0,log:[]};
    if(k==='fb')return{a:0,b:0,p:0,log:[],goals:[]};
    if(k==='bm')return{pts:[0,0],games:[0,0],g:1,done:[],log:[]};
    return{inn:0,done:false,keep:{a:-1,b:-1},i:[inn(),inn()],log:[]};
  }
  function fresh(){
    return{view:'home',sport:'basketball',live:null,profile:{name:'',photo:'',ok:0,contact:{type:'email',value:''}},accounts:[],meId:null,names:{a:'Home',b:'Away'},cfg:cfg0(),
      bb:newMatch('bb'),fb:newMatch('fb'),bm:newMatch('bm'),ck:newMatch('ck')};
  }
  function valid(o){
    try{
      return !!(o&&KEY[o.sport]&&o.names&&o.cfg&&o.cfg.ck&&o.cfg.fb&&o.cfg.bm&&
        o.cfg.ck.pl&&o.cfg.fb.pl&&o.cfg.bm.pl&&Array.isArray(o.cfg.ck.pl.a)&&Array.isArray(o.cfg.ck.pl.b)&&
        Array.isArray(o.cfg.fb.pl.a)&&Array.isArray(o.cfg.fb.pl.b)&&Array.isArray(o.cfg.bm.pl.a)&&Array.isArray(o.cfg.bm.pl.b)&&
        o.bb&&o.fb&&o.bm&&o.ck&&Array.isArray(o.fb.goals)&&Array.isArray(o.ck.i)&&o.ck.i.length===2&&
        Array.isArray(o.bm.pts)&&Array.isArray(o.bm.games)&&Array.isArray(o.bm.done)&&
        Array.isArray(o.bb.log)&&Array.isArray(o.fb.log)&&Array.isArray(o.bm.log)&&Array.isArray(o.ck.log));
    }catch(e){return false}
  }
  function load(){
    try{
      var raw=localStorage.getItem(STORE);
      if(raw){
        var o=JSON.parse(raw);
        if(valid(o)){
          if(!o.profile||typeof o.profile.name!=='string')o.profile={name:'',photo:''};
          if(!o.profile.contact||typeof o.profile.contact.value!=='string')o.profile.contact={type:'email',value:''};
          if(o.profile.ok===undefined)o.profile.ok=o.profile.name.trim()?1:0;
          if(o.cfg.ck.mode==='negative'){o.cfg.ck.mode='standard';o.cfg.ck.neg=1}
          if(o.cfg.ck.neg===undefined)o.cfg.ck.neg=0;
          if(o.cfg.ck.negov===undefined)o.cfg.ck.negov=0;
          if(o.cfg.ck.n===undefined){var ml=Math.max(o.cfg.ck.pl.a.length,o.cfg.ck.pl.b.length);o.cfg.ck.n=ml?Math.max(2,ml):11}
          if(!o.ck.keep)o.ck.keep={a:-1,b:-1};
          o.ck.i.forEach(function(x){if(x.bowl===undefined){x.bowl=-1;x.bw={}}});
          if(!Array.isArray(o.accounts)){
            o.accounts=[];o.meId=null;
            if(o.profile.ok&&o.profile.name.trim()){o.profile.id='acc1';o.accounts.push(o.profile);o.meId='acc1'}
          }
          o.accounts=o.accounts.filter(function(a){return a&&typeof a.id==='string'&&typeof a.name==='string'&&a.contact&&typeof a.contact.value==='string'});
          var me0=o.accounts.filter(function(a){return a.id===o.meId})[0];
          o.profile=me0||{name:'',photo:'',ok:0,contact:{type:'email',value:''}};
          if(!me0)o.meId=null;
          if(o.view==='profile'||o.view==='auth'||o.view==='people'||o.view==='person'||String(o.view).indexOf('t-')===0)o.view='home';
          return o;
        }
      }
    }catch(e){}
    return fresh();
  }
  var saveHook=null;
  function save(){
    if(saveHook)saveHook();
    if(TMODE){pushState();return}
    try{var o=Object.assign({},S);o.profile=null;localStorage.setItem(STORE,JSON.stringify(o))}catch(e){}
  }

  var S=load();

  /* each account (and the signed-out guest) keeps its own quick matches */
  var QK=['sport','live','names','cfg','bb','fb','bm','ck'];
  function slotKey(id){return id||'_guest'}
  function stashSlot(){
    S.slots=S.slots||{};
    var o={};QK.forEach(function(k){o[k]=S[k]});
    S.slots[slotKey(S.meId)]=JSON.parse(JSON.stringify(o));
  }
  function loadSlot(id){
    var o=S.slots&&S.slots[slotKey(id)],f=fresh();
    var ok=!!o;
    if(ok){var t=Object.assign({},f,o);ok=valid(t)}
    QK.forEach(function(k){S[k]=ok?o[k]:f[k]});
    Object.keys(H).forEach(function(k){H[k].length=0});
    if(typeof armed!=='undefined')armed=false;
    if(S.view==='play'&&!S.live)S.view='home';
  }
  function switchUser(id){
    id=id||null;
    if(id===(S.meId||null))return;
    stashSlot();
    S.meId=id;
    loadSlot(id);
    if(S.slots)delete S.slots[slotKey(id)];
  }
  var H={bb:[],fb:[],bm:[],ck:[]};
  var armed=false;
  var pick=null;
  var rp=null;

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function nm(t){var v=(S.names[t]||'').trim();return v||(t==='a'?'Home':'Away')}
  function ovs(n){return Math.floor(n/6)+'.'+(n%6)}
  function lg(o,msg){o.log.unshift(msg);if(o.log.length>40)o.log.length=40}
  function parseNames(txt){
    return String(txt).split(/[\n,]+/).map(function(s){return s.trim().slice(0,18)}).filter(Boolean).slice(0,15);
  }

  function commit(fn){
    var k=KEY[S.sport];
    H[k].push(JSON.stringify(S[k]));
    if(H[k].length>200)H[k].shift();
    fn(S[k]);
    save();render();
  }

  /* cricket helpers */
  function pname(t,i){var l=S.cfg.ck.pl[t];return(l&&l[i])||('Player '+(i+1))}
  function csize(){return S.cfg.ck.n}
  function bstat(x,i){return x.bat[i]||(x.bat[i]={r:0,b:0,out:false})}
  function swapStrike(x){var s=x.str;x.str=x.non;x.non=s}
  function mult(x){var g=S.cfg.ck;return(g.mode==='double'&&Math.floor(x.balls/6)<g.dbl)?2:1}

  /* next batter: who can come in, and putting them in */
  function nextBatters(x,bt){
    var g=S.cfg.ck,n=csize(bt),other=x.str===x.need?x.non:x.str,fresh=[],back=[];
    var negNow=g.neg&&(!g.negov||Math.floor(x.balls/6)<g.negov);
    for(var i=0;i<n;i++){
      if(i===other||i===x.need)continue;
      var st=x.bat[i];
      if(!st)fresh.push(i);
      else if(st.ret&&!st.out)back.push(i);
      else if(!st.out)fresh.push(i);
      else if(negNow)back.push(i);
    }
    if(g.neg&&negNow&&x.need!==null&&x.need!==undefined&&x.bat[x.need]&&x.bat[x.need].out)back.push(x.need);
    return fresh.concat(back);
  }
  function fillBat(x,i){
    if(x.need===null||x.need===undefined)return;
    if(x.str===x.need)x.str=i;else x.non=i;
    var st=x.bat[i];
    if(st){st.out=false;st.ret=false}
    x.need=null;
  }
  function celLabel(n){return n===50?'Fifty':(n===100?'Century':(n===200?'Double century':n+' runs'))}
  function ckBall(kind,n,ex){
    var c=S.ck,g=S.cfg.ck;
    if(c.done||c.i[c.inn].over||(c.i[c.inn].need!==null&&c.i[c.inn].need!==undefined)||(!c.i[c.inn].opened&&!c.i[c.inn].t.length)||c.i[c.inn].repick)return;
    var bt=c.inn?'b':'a',fl=c.inn?'a':'b';
    if(c.i[c.inn].bowl<0&&!window.__autoBowl)return;
    commit(function(o){
      var x=o.i[o.inn],m=mult(x),ov=Math.floor(x.balls/6),tok,cls='',msg,add;
      var sn=pname(bt,x.str),s=bstat(x,x.str),legal=true;
      if(x.bowl<0&&window.__autoBowl){x.bowl=x.lastBowl===0?1:0}
      var bi=x.bowl,bw=null;
      if(bi>=0)bw=x.bw[bi]||(x.bw[bi]={b:0,r:0,w:0});
      if(kind==='run'){
        add=n*m;x.runs+=add;s.r+=add;s.b++;x.balls++;
        var pr0=s.r-add,celN=0;[50,100,150,200,250,300].forEach(function(mm){if(pr0<mm&&s.r>=mm)celN=mm});
        if(celN)o.cel={id:Date.now().toString(36)+'-'+celN,at:Date.now(),n:celN,name:sn,r:s.r,b:s.b,team:nm(bt)};
        if(bw){bw.b++;bw.r+=add}
        tok=String(add);if(n===4||n===6)cls='f';
        msg=n===0?'dot ball':add+(add===1?' run':' runs')+(m===2?' (double)':'');
        if(n%2===1)swapStrike(x);
      }else if(kind==='wd'||kind==='nb'){
        add=1;x.runs+=add;x.ex+=add;legal=false;
        if(bw)bw.r+=add;
        tok=kind==='wd'?'Wd':'Nb';cls='ex';
        msg=(kind==='wd'?'wide':'no ball')+', '+add+(add===1?' extra':' extras');
      }else{
        s.b++;x.balls++;x.wk++;tok='W';cls='w';
        if(bw)bw.b++;
        var negAt=g.neg&&(!g.negov||ov<g.negov),more=negAt||(x.wk-(x.wk0||0))<csize(bt)-1,oi,how;
        if(kind==='ro'){
          var fi=ex.f;oi=ex.who==='str'?x.str:x.non;
          var fnm=fi>=0?pname(fl,fi)+(o.keep[fl]===fi?' (wk)':''):'direct hit';
          how='run out ('+fnm+')';
          msg='run out, '+pname(bt,oi)+' (by '+fnm+')';
        }else{
          oi=x.str;
          var hw=(ex&&ex.how)||'out',bwn=bi>=0?pname(fl,bi):'',bpart=bwn?' b '+bwn:'',ff=ex&&ex.f!==undefined?ex.f:-1;
          if(hw==='bowled')how='b '+(bwn||'bowler');
          else if(hw==='caught')how=(ff>=0&&ff===bi)?'c & b '+bwn:'c '+(ff>=0?pname(fl,ff):'fielder')+bpart;
          else if(hw==='lbw')how='lbw'+bpart;
          else if(hw==='stumped'){var kk=o.keep[fl];how='st '+(kk>=0?pname(fl,kk):'keeper')+bpart}
          else if(hw==='hitwicket')how='hit wicket'+bpart;
          else how='out'+bpart;
          msg=sn+' '+how;
          if(bw)bw.w++;
        }
        var so=bstat(x,oi);so.out=true;so.ret=false;so.outs=(so.outs||0)+1;so.how=how;
        if(more){
          x.need=oi;
          var cs=nextBatters(x,bt);
          if(cs.length===1&&!g.neg)fillBat(x,cs[0]);
        }
        if(g.neg&&(!g.negov||ov<g.negov)){x.runs-=g.pen;msg+=' (-'+g.pen+')'}
      }
      var overDone=legal&&x.balls%6===0;
      if(overDone)swapStrike(x);
      x.t.push({o:ov,k:tok,c:cls});
      lg(o,nm(bt)+' '+x.runs+'/'+x.wk+' · '+ovs(x.balls)+' ov · '+(bi>=0?pname(fl,bi)+' to ':'')+sn+', '+msg);
      if(kind==='run'&&celN)lg(o,'🎉 '+celLabel(o.cel.n)+' for '+sn+'! '+s.r+' off '+s.b);
      if(legal&&g.neg&&g.negov&&x.balls===g.negov*6&&x.balls<g.overs*6&&!x.repick){x.repick=true;x.need=null;x.wk0=x.wk;lg(o,'Negative-run overs are over. Choose the batters again')}
      var negLeft=g.neg&&(!g.negov||Math.floor(x.balls/6)<g.negov);
      if((!negLeft&&!x.repick&&(x.wk-(x.wk0||0))>=csize(bt)-1)||x.balls>=g.overs*6){x.over=true;x.need=null;x.repick=false}
      if(o.inn===1&&x.runs>o.i[0].runs)x.over=true;
      if(o.inn===1&&x.over)o.done=true;
      if(overDone&&!x.over&&!o.done){x.lastBowl=bi;x.bowl=-1;lg(o,'End of over '+(x.balls/6)+' · '+pname(bt,x.str)+' on strike')}
    });
  }

  /* badminton */
  function bmPoint(t){
    var m=S.bm;
    if(m.games[0]===2||m.games[1]===2)return;
    var i=t==='a'?0:1;
    commit(function(o){
      o.pts[i]++;
      var p=o.pts[0],q=o.pts[1],hi=Math.max(p,q),lo=Math.min(p,q);
      if((hi>=21&&hi-lo>=2)||hi===30){
        var w=p>q?0:1;
        o.games[w]++;
        o.done.push([p,q]);
        lg(o,'Game '+o.g+' · '+nm(w?'b':'a')+' won '+p+'–'+q);
        o.pts=[0,0];
        if(o.games[w]<2)o.g++;
      }else{
        lg(o,'Game '+o.g+' · point to '+nm(t)+' ('+p+'–'+q+')');
      }
    });
  }

    });
  }

  function tossAct(a,v){
    var c=S.ck;
    if(c.inn!==0||c.i[0].t.length)return;
    if(a==='toss:caller'){tossv={caller:v};render()}
    else if(a==='toss:call'){
      var caller=(tossv&&tossv.caller)||'b';
      tossv={stage:'spin',caller:caller,call:v};render();
      setTimeout(function(){
        if(!tossv||tossv.stage!=='spin')return;
        var res=coinFlip(),win=res===v?caller:(caller==='a'?'b':'a');
        tossv={stage:'done',caller:caller,call:v,res:res,win:win};
        render();
      },window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches?150:1000);
    }
    else if(a==='toss:again'){tossv={caller:(tossv&&tossv.caller)||'b'};render()}
    else if(a==='toss:dec'&&tossv&&tossv.stage==='done'){
      var w=tossv.win,bf=v==='bat'?w:(w==='a'?'b':'a');
      setToss(bf,{how:'coin',win:nm(w),call:tossv.call,res:tossv.res,dec:v});
    }
    else if(a==='toss:pick')setToss(v,{how:'pick'});
    else if(a==='toss:redo'){c.toss=null;tossv=null;c.i[0].opened=false;lg(c,'Toss cancelled');save();render()}
  }

  function newSalt(){var a=new Uint8Array(16);window.crypto.getRandomValues(a);return hexOf(a.buffer)}

    var enc=new TextEncoder();

  function readPhoto(file){

    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(im.width,im.height),c=document.createElement('canvas');
        if(!s)return;
        c.width=c.height=192;
        c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,192,192);
        var tgt=S.view==='auth'?draft:S.profile;
        try{tgt.photo=c.toDataURL('image/jpeg',0.85)}catch(e){return}
        if(tgt===S.profile)save();
        render();renderTop();
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* teams, wins */

  /* fixtures */
  function roundRobin(teams){
    var t=teams.slice();
    if(t.length%2)t.push(null);
    var n=t.length,rounds=[];
    for(var r=0;r<n-1;r++){
      var pairs=[];
      for(var i=0;i<n/2;i++){var a=t[i],b=t[n-1-i];if(a&&b)pairs.push([a,b])}
      rounds.push(pairs);
      t.splice(1,0,t.pop());
    }
    return rounds;
  }
  function matchCfg(t,A,B){
    var pl={a:(A.players||[]).slice(),b:(B.players||[]).slice()};
    if(t.sport==='cricket'){var c=clone(t.cfg||{});c.pl=pl;return c}
    if(t.sport==='football')return{pl:pl};
    if(t.sport==='badminton')return{fmt:'singles',pl:{a:pl.a.slice(0,1),b:pl.b.slice(0,1)}};
    return null;
  }

  /* results and standings */
  function resultOf(sport,o){
    var sa,sb;
    if(sport==='cricket'){sa=o.i[0].runs;sb=o.i[1].runs}
    else if(sport==='badminton'){sa=o.games[0];sb=o.games[1]}
    else{sa=o.a;sb=o.b}
    return{w:sa>sb?'a':(sb>sa?'b':'t'),sa:sa,sb:sb};
  }
  function ballsFaced(x,cfg){return(!cfg.neg&&x.wk>=(cfg.n||11)-1)?cfg.overs*6:x.balls}
  function standings(tid){
    var t=T[tid];
    if(!t)return[];
    var rows={};
    teamsOf(tid).forEach(function(x){rows[x.key]={key:x.key,name:x.name,uid:x.uid||null,form:[],p:0,w:0,l:0,d:0,pts:0,f:0,a:0,rf:0,bf:0,ra:0,ba:0}});
    matchesOf(tid).forEach(function(e){
      var m=e.m;
      if(m.status!=='done'||!m.result)return;
      var A=rows[m.a.key],B=rows[m.b.key];
      if(!A||!B)return;
      var r=m.result;
      A.p++;B.p++;
      var tl=t.sport==='football'?'D':'T';
      if(r.w==='t'){A.d++;B.d++;A.form.push(tl);B.form.push(tl)}else if(r.w==='a'){A.w++;B.l++;A.form.push('W');B.form.push('L')}else{B.w++;A.l++;B.form.push('W');A.form.push('L')}
      var win=t.sport==='football'?3:2,tie=1;
      A.pts+=r.w==='a'?win:(r.w==='t'?tie:0);
      B.pts+=r.w==='b'?win:(r.w==='t'?tie:0);
      A.f+=r.sa;A.a+=r.sb;B.f+=r.sb;B.a+=r.sa;
      if(t.sport==='cricket'&&m.state&&m.cfg){
        var i0=m.state.i[0],i1=m.state.i[1],b0=ballsFaced(i0,m.cfg),b1=ballsFaced(i1,m.cfg);
        A.rf+=i0.runs;A.bf+=b0;A.ra+=i1.runs;A.ba+=b1;
        B.rf+=i1.runs;B.bf+=b1;B.ra+=i0.runs;B.ba+=b0;
      }
    });
    var list=Object.keys(rows).map(function(k){
      var r=rows[k];
      r.nrr=(r.bf&&r.ba)?(r.rf*6/r.bf-r.ra*6/r.ba):0;
      r.diff=r.f-r.a;
      return r;
    });
    list.sort(function(x,y){
      if(y.pts!==x.pts)return y.pts-x.pts;
      if(t.sport==='cricket'){if(y.nrr!==x.nrr)return y.nrr-x.nrr}

    });

  }

  /* awards: Man of the Match and Player of the Tournament */
  function plName(m,tm,i){var l=m.cfg&&m.cfg.pl&&m.cfg.pl[tm];return(l&&l[i])||('Player '+(i+1))}
  function matchStats(m){
    var o=m.state,out={};
    if(!o)return[];
    function add(tm,name,pts,key,n){
      var k=tm+'|'+name,e=out[k]||(out[k]={t:tm,name:name,pts:0,r:0,wk:0,g:0,w:0,bl:0,bb:0,rc:0});
      e.pts+=pts;e[key]+=n;return e;
    }
    if(m.sport==='cricket'&&o.i){
      o.i.forEach(function(x,ix){
        var bt=ix?'b':'a',fl=ix?'a':'b';
        Object.keys(x.bat||{}).forEach(function(i){var s=x.bat[i];if(s.r>0||s.b>0){var e=add(bt,plName(m,bt,Number(i)),s.r,'r',s.r);e.bl+=s.b}});
        Object.keys(x.bw||{}).forEach(function(i){var s=x.bw[i];if(s.w>0||s.b>0){var e=add(fl,plName(m,fl,Number(i)),25*s.w,'wk',s.w);e.bb+=s.b;e.rc+=s.r}});
      });
    }else if(m.sport==='football'&&o.goals){
      o.goals.forEach(function(g){if(!g.own&&g.p)add(g.t,g.p,1,'g',1)});
    }else if(m.sport==='badminton'&&m.result&&m.result.w!=='t'){
      var w=m.result.w,l=m.cfg&&m.cfg.pl&&m.cfg.pl[w];
      if(l&&l[0])add(w,l[0],1,'w',1);
    }
    return Object.keys(out).map(function(k){return out[k]});
  }
  function statLine(e,sport){
    if(sport==='cricket'){
      var p=[];
      if(e.r)p.push(e.r+(e.r===1?' run':' runs'));
      if(e.wk)p.push(e.wk+(e.wk===1?' wicket':' wickets'));
      return p.join(', ');
    }
    if(sport==='football')return e.g+(e.g===1?' goal':' goals');
    if(sport==='badminton')return e.w+(e.w===1?' match win':' match wins');
    return '';
  }
  function autoMom(m){
    var s=matchStats(m);

    var w=m.result?m.result.w:'t';
    s.sort(function(x,y){return y.pts-x.pts||((y.t===w?1:0)-(x.t===w?1:0))});
    if(s[0].pts<=0)return null;
    return{t:s[0].t,name:s[0].name,line:statLine(s[0],m.sport),auto:true};

  /* access panel, shared by tournaments and auctions */
  function accessHTML(kind,id){

        '<p class="lbl" style="margin:4px 0 0">Can manage</p><div class="rowline"><b>'+esc(tName(o.owner))+' (you, owner)</b></div>'+

      (req?'':'<div class="bar"><button class="btn ghost" data-act="acc:ask" data-k="'+kind+'" data-id="'+esc(id)+'">Ask to manage</button></div>')+'</section>';

  function accAct(a,kind,id,u){
    var src=kind==='t'?T:A,o=src[id];
    if(!o||tbusy||!IS_ADMIN)return;
    var d=clone(o),isOwner=o.owner&&o.owner===UID,msg='';
    d.managers=d.managers||[];d.requests=d.requests||[];
    if(a==='acc:claim'){if(o.owner||!UID)return;d.owner=UID;msg='You now own this.'}
    else if(a==='acc:ask'){if(!UID||canManage(o)||d.requests.indexOf(UID)>=0)return;d.requests.push(UID);msg='Request sent to the owner.'}
    else{
      if(!isOwner||!u)return;
      d.requests=d.requests.filter(function(x){return x!==u});
      if(a==='acc:ok'){if(d.managers.indexOf(u)<0)d.managers.push(u);msg=tName(u)+' can now manage it.'}
      else if(a==='acc:no')msg='Request declined.';
      else if(a==='acc:rm'){d.managers=d.managers.filter(function(x){return x!==u});msg=tName(u)+' can no longer manage it.'}
    }
    if(kind==='a')A[id]=d;
    wr(DB.doc((kind==='t'?'tournaments/':'auctions/')+id).set(d),msg);
  }

  function doRegister(){
    var t=T[curT];

    var name=rdraft.team.trim(),pl=parseNames(rdraft.players),lim=t.sport==='cricket'&&t.cfg?t.cfg.n:15,err='';
    var has=!!(UID&&R[UID]&&R[UID].t&&R[UID].t[curT]);

    else if(!openReg(t))err='Registration is closed. The organizer adds the teams.';
    else if(!UID)err=API?'Sign in to register.':'Sign in to Claude to register.';
    else if(name.length<2)err='Enter a team name of at least 2 characters.';
    else if(pl.length>lim)err='This tournament allows up to '+lim+' players a team.';
    else if(teamsOf(curT).some(function(x){return x.name.toLowerCase()===name.toLowerCase()&&x.uid!==UID}))err='That team name is taken.';
    else if(!has&&teamsOf(curT).length>=t.max)err='This tournament is full.';
    if(err){tmsg=err;render();return}
    var cur=R[UID]?clone(R[UID]):{t:{}};
    cur.t=cur.t||{};
    cur.t[curT]={team:name,players:pl,at:has?(cur.t[curT].at||Date.now()):Date.now()};

    var seen={},out=[];
    String(txt).split(/\n/).forEach(function(l){
      var n=l.trim().slice(0,20),k=n.toLowerCase();
      if(n&&!seen[k]){seen[k]=1;out.push(n)}
    });
    return out.slice(0,12);
  }
  function num(s){var m=String(s||'').replace(/[^\d]/g,'');return m?Math.min(BIG,parseInt(m,10)):0}
  function parseCats(txt){
    var seen={},out=[];
    String(txt).split(/\n/).forEach(function(l){
      var p=l.split(','),n=(p[0]||'').trim().slice(0,18),k=n.toLowerCase();
      if(n&&!seen[k]){seen[k]=1;out.push({id:out.length,name:n,base:num(p[1]),cap:num(p[2])})}
    });
    return out.slice(0,8);
  }
  function parsePlayers(txt,base,cs){
    var out=[],bad=[];
    String(txt).split(/\n/).forEach(function(l){
      l=l.trim();
      if(!l)return;
      var parts=l.split(','),name,price=0,cat=-1;
      if(parts.length===1){
        var m=/^(.*?)\s*[\-–:]\s*(\d+)$/.exec(l);
        name=(m?m[1]:l).trim();price=m?num(m[2]):0;
      }else{
        name=parts[0].trim();
        parts.slice(1).forEach(function(x){
          x=x.trim();
          if(!x)return;
          if(/^\d+$/.test(x))price=num(x);
          else{
            var hit=cs.filter(function(c){return c.name.toLowerCase()===x.toLowerCase()})[0];
            if(hit)cat=hit.id;else bad.push(x);
          }
        });
      }
      name=name.slice(0,24);
      if(!name)return;
      var b=price||(cat>=0&&cs[cat].base>0?cs[cat].base:base);
      out.push({id:out.length,name:name,base:Math.max(1,b),cat:cat,status:'pool',team:-1,price:0});
    });
    return{list:out.slice(0,80),bad:bad};
  }

  /* actions */
  function doACreate(){
    if(tbusy||!IS_ADMIN)return;
    var d=adraft,nm0=d.name.trim(),tm=parseTeams(d.teams),cs=[],pl=[],err='',bad=[];
    if(d.nc>0){
      d.cl.forEach(function(c,i){
        var nmc=(c.name||'').trim().slice(0,18)||(String.fromCharCode(65+i)+' class'),base=num(c.base);
        if(cs.some(function(x){return x.name.toLowerCase()===nmc.toLowerCase()}))bad.push(nmc);
        cs.push({id:i,name:nmc,base:base,cap:num(c.cap)});
        parsePlayers(c.players,base||d.base,[]).list.forEach(function(p){p.cat=i;pl.push(p)});
      });
      pl.forEach(function(p,i){p.id=i});pl=pl.slice(0,80);
    }else pl=parsePlayers(d.players,d.base,[]).list;
    if(nm0.length<2)err='Enter an auction name of at least 2 characters.';
    else if(tm.length<2)err='Enter at least 2 different team names.';
    else if(bad.length)err='Give each category a different name. "'+bad[0]+'" is used twice.';
    if(err){tmsg=err;render();return}
    var id='a'+Date.now().toString(36)+Math.floor(Math.random()*1000);
    var doc={owner:UID||null,managers:[],requests:[],name:nm0.slice(0,40),sport:d.sport,purse:d.purse,base:d.base,inc:d.inc,squad:d.squad,status:'live',createdAt:Date.now(),cats:cs,
      teams:tm.map(function(n,i){return{id:i,name:n,purse:d.purse,purse0:d.purse,squad:[],cs:cs.map(function(){return 0})}}),players:pl,lot:null,log:['Auction created']};
    wr(DB.doc('auctions/'+id).set(doc),'',function(){curA=id;S.view='t-adetail';tmsg='';adraft.pick='';adraft.amt=0;ss={i:0,play:true,cat:-1}});
  }
  function aEdit(fn){
    var a=A[curA];

  function doBid(i){
    aEdit(function(d){
      var tm=d.teams[i];
      if(!d.lot||!tm)return false;
      var lb=lastBid(d),mn=minBid(d),amt=adraft.amt>0?adraft.amt:mn,err='',p=d.players[d.lot.pid],c=p.cat>=0?cats(d)[p.cat]:null;
      if(lb&&lb.team===i)err='That team already leads.';
      else if(amt<mn)err='Bid at least '+fmt(mn)+'.';
      else if(tm.squad.length>=d.squad)err='This team squad is full.';
      else if(amt>tm.purse)err='Not enough budget left.';
      else if(c&&c.cap>0&&((tm.cs&&tm.cs[c.id])||0)+amt>c.cap)err='Over the '+c.name+' budget: '+fmt(Math.max(0,c.cap-((tm.cs&&tm.cs[c.id])||0)))+' left for this category.';
      if(err){tmsg=err;render();return false}
      tmsg='';d.lot.hist.push({team:i,amt:amt});adraft.amt=0;
      alog(d,tm.name+' bids '+fmt(amt)+' for '+p.name);
    });
  }
  function doSold(){
    aEdit(function(d){
      var lb=lastBid(d);
      if(!d.lot||!lb)return false;
      var p=d.players[d.lot.pid],tm=d.teams[lb.team];
      p.status='sold';p.team=lb.team;p.price=lb.amt;
      tm.purse-=lb.amt;tm.squad.push({pid:p.id,name:p.name,price:lb.amt});
      if(p.cat>=0){tm.cs=tm.cs||cats(d).map(function(){return 0});tm.cs[p.cat]=(tm.cs[p.cat]||0)+lb.amt}
      alog(d,p.name+' sold to '+tm.name+' for '+fmt(lb.amt));
      d.lot=null;adraft.pick='';adraft.amt=0;tmsg='';
    });
  }
  function doUnsold(){

  function wallHTML(){
    if(TST==='none'||TST==='idle')return '';
    if(TST!=='ready')return '<section class="panel"><p class="lbl">Tournament wall</p><p class="hint">Loading photos…</p></section>';
    var ps=allPosts().slice(0,24),canPost=!!UID&&CAN_WRITE!==false,tids=Object.keys(T).sort(function(a,b){return(T[b].createdAt||0)-(T[a].createdAt||0)});
    var h='<section class="panel"><div class="rowline" style="padding:0;border:0"><p class="lbl" style="margin:0">Tournament wall</p>'+
      (canPost&&!xd.open?'<button class="btn ghost" data-act="x:open">+ Post a photo</button>':'')+'</div>';
    if(xd.open&&canPost){
      h+='<div class="picker">'+(xd.img?'<img class="post-prev" src="'+xd.img+'" alt="Your photo">':'')+
        '<div class="bar"><input id="xpost" class="sr" type="file" accept="image/*" data-xfile="img"><label class="btn ghost filebtn" for="xpost">'+(xd.img?'Change photo':'Choose photo')+'</label></div>'+
        '<label class="field"><span class="lbl">Caption</span><input class="inp" data-in="x:cap" maxlength="120" autocomplete="off" placeholder="Final over drama!" value="'+esc(xd.cap)+'"></label>'+
        (tids.length?'<label class="field"><span class="lbl">Tournament, optional</span><select data-xsel="tid"><option value="">None</option>'+tids.map(function(id){return '<option value="'+esc(id)+'"'+(id===xd.tid?' selected':'')+'>'+esc(T[id].name)+'</option>'}).join('')+'</select></label>':'')+
        '<div class="bar"><button class="btn solid" data-act="x:post"'+(xbusy||!xd.img?' disabled':'')+'>'+(xbusy?'Posting…':'Post')+'</button><button class="btn ghost" data-act="x:cancel">Cancel</button></div>'+
        '<p class="hint">Everyone who opens Tally Board sees your photo. You can keep up to 6 photos on the wall.</p></div>';
    }else if(!canPost){
      h+='<p class="hint">'+(UID?'Ask the owner for Contributor access to post photos.':(API?'Sign in to post photos.':'Open this page from its Claude link while signed in to post photos.'))+'</p>';
    }
    if(!ps.length)h+='<p class="hint">No photos yet. Share the first one from your tournament.</p>';
    else h+='<div class="wall">'+ps.map(function(p){
      var t=p.tid&&T[p.tid],mine=p.uid&&p.uid===UID;
      return '<figure class="post'+(p.champ?' champ':'')+'"><img src="'+p.img+'" alt="'+esc(p.cap||'Tournament photo')+'" loading="lazy">'+
        (p.champ?'<span class="post-badge">🏆 Champions'+(p.champName?' · '+esc(p.champName):'')+'</span>':'')+
        '<figcaption>'+(p.cap?'<b>'+esc(p.cap)+'</b>':'')+'<span>'+esc([t?t.name:'',p.champ?'Organizer':(p.uid?tName(p.uid):''),when(p.at)].filter(Boolean).join(' · '))+'</span>'+
        (!p.champ&&(mine||IS_OWNER)?'<button class="btn ghost" data-act="x:del" data-u="'+esc(p.uid)+'" data-id="'+esc(p.id)+'">Delete</button>':'')+'</figcaption></figure>';
    }).join('')+'</div>';
    return h+tmsgLine()+'</section>';
  }
  function doPost(){
    if(xbusy||!UID||!xd.img)return;
    var cur=PO[UID]?clone(PO[UID]):{items:[]};
    cur.items=(cur.items||[]).concat([{id:'p'+Date.now().toString(36),img:xd.img,cap:xd.cap.trim().slice(0,120),tid:xd.tid||'',at:Date.now()}]);
    while(cur.items.length>6)cur.items.shift();
    xbusy=true;render();
    DB.doc('posts/'+UID).set(cur).then(function(){
      xbusy=false;PO[UID]=cur;xd.open=false;xd.img='';xd.cap='';xd.tid='';tmsg='';render();
    }).catch(function(){xbusy=false;tmsg='Could not post the photo. Try a smaller one.';render()});
  }
  function doDelPost(u,id){
    if(!(u===UID||IS_OWNER)||!PO[u])return;
    var cur=clone(PO[u]);
    cur.items=(cur.items||[]).filter(function(it){return it.id!==id});
    PO[u]=cur;render();
    DB.doc('posts/'+u).set(cur).catch(function(){tmsg='Could not delete it. Try again.';render()});
  }

  /* ---- champions photo (tournament page) ---- */
  function champPhotoHTML(t){
    if(t.status!=='done')return '';
    var c=t.champPhoto,h='';
    if(c&&okImg(c.img))h='<figure class="post champ" style="margin:0"><img src="'+c.img+'" alt="Champions photo"><figcaption>'+(c.cap?'<b>'+esc(c.cap)+'</b>':'')+'</figcaption></figure>';
    if(MG()){
      h+='<div class="picker"><p class="lbl" style="margin:0">'+(c?'Change the champions photo':'Post a champions photo (optional)')+'</p>'+
        (xd.cimg?'<img class="post-prev" src="'+xd.cimg+'" alt="">':'')+
        '<div class="bar"><input id="xchamp" class="sr" type="file" accept="image/*" data-xfile="cimg"><label class="btn ghost filebtn" for="xchamp">'+(xd.cimg?'Change photo':'Choose photo')+'</label></div>'+
        '<label class="field"><span class="lbl">Caption</span><input class="inp" data-in="x:ccap" maxlength="120" autocomplete="off" placeholder="'+esc(t.champion?t.champion.name+' lift the cup':'Our champions')+'" value="'+esc(xd.ccap)+'"></label>'+
        '<div class="bar"><button class="btn solid" data-act="x:cpost"'+(tbusy||!xd.cimg?' disabled':'')+'>Post to the wall</button>'+(c?'<button class="btn ghost" data-act="x:crm">Remove photo</button>':'')+'</div>'+
        '<p class="hint">It also shows on the home page wall.</p></div>';
    }
    return h?'<section class="panel"><p class="lbl">Champions photo</p>'+h+'</section>':'';
  }
  function tSet(fn,msg){
    var t=T[curT];if(!t||tbusy||!MG())return;
    var d=clone(t);fn(d);
    wr(DB.doc('tournaments/'+curT).set(d),msg);
  }

  /* ---- sponsors ---- */
  var TIERS=['Title sponsor','Co-sponsor','Partner'];
  function sponsorsHTML(t){
    var sp=t.sponsors||[],mg=MG(),h='';
    if(!sp.length&&!mg)return '';
    if(sp.length)h+=TIERS.map(function(tier){
      var g=sp.filter(function(s){return(s.tier||'Partner')===tier});
      if(!g.length)return '';
      return '<p class="lbl" style="margin:6px 0 0">'+esc(tier)+(g.length>1&&tier!=='Title sponsor'?'s':'')+'</p><div class="spons">'+g.map(function(s){
        return '<div class="spon'+(tier==='Title sponsor'?' big':'')+'">'+(okImg(s.logo)?'<img src="'+s.logo+'" alt="">':'')+'<b>'+esc(s.name)+'</b>'+
          (mg?'<button class="btn ghost" data-act="x:srm" data-id="'+esc(s.id)+'" aria-label="Remove '+esc(s.name)+'">✕</button>':'')+'</div>';
      }).join('')+'</div>';
    }).join('');
    if(mg){
      h+='<div class="picker"><p class="lbl" style="margin:0">Add a sponsor</p>'+
        '<div class="opts"><label class="field"><span class="lbl">Name</span><input class="inp" data-in="x:sname" maxlength="40" autocomplete="off" placeholder="Sharma Sports" value="'+esc(xd.sname)+'"></label>'+
        '<label class="field"><span class="lbl">Type</span><select data-xsel="stier">'+TIERS.map(function(x){return '<option'+(x===xd.stier?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label></div>'+
        '<div class="prow">'+(xd.slogo?'<img class="avatar big" style="border-radius:12px;object-fit:contain;background:#fff" src="'+xd.slogo+'" alt="">':'')+
        '<div class="bar"><input id="xlogo" class="sr" type="file" accept="image/*" data-xfile="slogo"><label class="btn ghost filebtn" for="xlogo">'+(xd.slogo?'Change logo':'Add logo (optional)')+'</label></div></div>'+
        '<div class="bar"><button class="btn ghost" data-act="x:sadd"'+(tbusy?' disabled':'')+'>Add sponsor</button></div></div>';
    }
    return '<section class="panel"><p class="lbl">Sponsors</p>'+h+'</section>';
  }
  function sponsorLine(t){
    var sp=(t&&t.sponsors)||[];
    if(!sp.length)return '';
    var title=sp.filter(function(s){return s.tier==='Title sponsor'})[0];
    return '<p class="hint spon-line">'+(title?(okImg(title.logo)?'<img src="'+title.logo+'" alt="">':'')+'Presented by <b>'+esc(title.name)+'</b>':'Sponsors: '+sp.map(function(s){return esc(s.name)}).join(', '))+'</p>';
  }

  /* ---- auction opening slides ---- */
  function openingHTML(a){
    if(!MA())return '';
    var sl=a.slides||[],on=a.introOn!==false;
    return '<section class="panel"><p class="lbl">Opening slides · shown in the slideshow before the players</p>'+
      '<div class="seg" role="group"><button type="button" data-act="x:oon" data-v="1"'+(on?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>Show them</button><button type="button" data-act="x:oon" data-v="0"'+(!on?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>Hide them</button></div>'+
      (sl.length?sl.map(function(s,i){
        var u=photoOf(curA,'s'+s.id);
        return '<div class="rowline"><div style="display:flex;align-items:center;gap:10px;min-width:0">'+(u?'<img class="avatar" style="border-radius:8px" src="'+u+'" alt="">':'<span class="avatar" aria-hidden="true">'+(i+1)+'</span>')+
          '<div style="min-width:0"><b>'+esc(s.title||'Slide '+(i+1))+'</b>'+(s.text?'<div class="hint">'+esc(s.text.slice(0,80))+'</div>':'')+'</div></div>'+
          '<button class="btn ghost rmx" data-act="x:orm" data-id="'+esc(s.id)+'" aria-label="Remove slide">✕</button></div>';
      }).join(''):'<p class="hint">No opening slides yet. Add welcome, rules or sponsor slides.</p>')+
      '<div class="picker"><label class="field"><span class="lbl">Title</span><input class="inp" data-in="x:otitle" maxlength="60" autocomplete="off" placeholder="Welcome to the auction" value="'+esc(xd.otitle)+'"></label>'+
      '<label class="field"><span class="lbl">Text, optional</span><textarea class="inp" style="min-height:80px" data-in="x:otext" maxlength="300" autocomplete="off" placeholder="Each team has 8 slots and a budget of 1,00,000">'+esc(xd.otext)+'</textarea></label>'+
      (xd.oimg?'<img class="post-prev" src="'+xd.oimg+'" alt="">':'')+
      '<div class="bar"><input id="xoimg" class="sr" type="file" accept="image/*" data-xfile="oimg"><label class="btn ghost filebtn" for="xoimg">'+(xd.oimg?'Change image':'Add image (optional)')+'</label>'+
      '<button class="btn solid" data-act="x:oadd">Add slide</button></div></div></section>';
  }
  function introSlide(a,sid){
    var s=(a.slides||[]).filter(function(x){return String(x.id)===String(sid)})[0];
    if(!s)return titleSlide(a);
    var u=photoOf(curA,'s'+s.id);
    return '<div class="pr-slide"'+(u?'':' style="grid-template-columns:1fr"')+'>'+(u?'<img class="pr-ph" style="object-fit:contain;background:#111C26" src="'+u+'" alt="">':'')+
      '<div class="pr-info"'+(u?'':' style="align-items:center;text-align:center"')+'><span class="pr-name" style="font-size:clamp(34px,6vw,96px)">'+esc(s.title||'')+'</span>'+
      (s.text?'<span class="pr-lead" style="text-transform:none;font:500 clamp(18px,2.4vw,30px)/1.35 var(--body);letter-spacing:0;color:#C9D4DC;white-space:pre-line">'+esc(s.text)+'</span>':'')+'</div></div>';
  }

  /* ---- events ---- */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-act]');
    if(!b||b.disabled)return;
    var a=b.getAttribute('data-act');
    if(a.indexOf('x:')!==0)return;
    switch(a){
      case 'x:open':xd.open=true;render();break;
      case 'x:cancel':xd.open=false;xd.img='';xd.cap='';render();break;
      case 'x:post':doPost();break;
      case 'x:del':doDelPost(b.getAttribute('data-u'),b.getAttribute('data-id'));break;
      case 'x:cpost':
        if(!xd.cimg)break;
        var ci=xd.cimg,cc=xd.ccap.trim().slice(0,120);
        tSet(function(d){d.champPhoto={img:ci,cap:cc,at:Date.now()}},'Champions photo posted. It is on the home page wall too.');
        xd.cimg='';xd.ccap='';break;
      case 'x:crm':tSet(function(d){d.champPhoto=null},'Champions photo removed.');break;
      case 'x:sadd':{
        var n=xd.sname.trim().slice(0,40);
        if(n.length<2){tmsg='Enter the sponsor name.';render();break}
        var lg0=xd.slogo,tr=TIERS.indexOf(xd.stier)>=0?xd.stier:'Partner';
        tSet(function(d){d.sponsors=(d.sponsors||[]).concat([{id:'s'+Date.now().toString(36),name:n,tier:tr,logo:lg0||''}])},'Sponsor added.');
        xd.sname='';xd.slogo='';break;
      }
      case 'x:srm':{var sid=b.getAttribute('data-id');tSet(function(d){d.sponsors=(d.sponsors||[]).filter(function(s){return s.id!==sid})},'Sponsor removed.');break}
      case 'x:oon':{var v=b.getAttribute('data-v')==='1';aEdit(function(d){d.introOn=v});break}
      case 'x:oadd':{
        var ti=xd.otitle.trim().slice(0,60),tx=xd.otext.trim().slice(0,300),im=xd.oimg;
        if(!ti&&!tx&&!im){tmsg='Add a title, text or image for the slide.';render();break}
        var nid=Date.now().toString(36);
        aEdit(function(d){d.slides=(d.slides||[]).concat([{id:nid,title:ti,text:tx}]);if(d.slides.length>12){tmsg='Keep it to 12 opening slides.';return false}});
        if(im&&A[curA]&&(A[curA].slides||[]).some(function(s){return s.id===nid})){
          var doc={u:im,aid:curA,pid:'s'+nid};P[curA+'_s'+nid]=doc;
          DB.doc('aphotos/'+curA+'_s'+nid).set(doc).catch(function(){tmsg='Could not save the slide image.';trender()});
        }
        xd.otitle='';xd.otext='';xd.oimg='';render();break;
      }
      case 'x:orm':{var oid=b.getAttribute('data-id');aEdit(function(d){d.slides=(d.slides||[]).filter(function(s){return String(s.id)!==String(oid)})});break}
    }
  });
  document.addEventListener('input',function(e){
    var el=e.target,d=el.getAttribute&&el.getAttribute('data-in');
    if(d&&d.indexOf('x:')===0)xd[d.slice(2)]=el.value;
  });
  document.addEventListener('change',function(e){
    var el=e.target;
    if(!el.getAttribute)return;
    var xs=el.getAttribute('data-xsel');
    if(xs){xd[xs]=el.value;return}
    var xf=el.getAttribute('data-xfile');
    if(xf){
      var f=el.files&&el.files[0];el.value='';
      var max=xf==='slogo'?300:(xf==='oimg'?1000:800);
      shrink(f,max,xf==='slogo'?.85:.74,function(u){xd[xf]=u;render()});
    }
  });

  render();
})();
</script>

</body></html>
